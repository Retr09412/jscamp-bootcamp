name: Setup pnpm and Node.js for CI/CD
description: Configura Node.js y pnpm para CI/CD

inputs:
  node-version:
    description: 'Versión de Node.js'
    required: false
    default: '24'
  pnpm-version:
    description: 'Versión de pnpm'
    required: false
    default: '11'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: 12-ejercicio-cicd/pnpm-lock.yaml
  

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: 12-ejercicio-cicd