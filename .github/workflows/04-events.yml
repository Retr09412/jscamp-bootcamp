name: 04 Events

on:
  issues: 
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Imprimir evento
        run: echo "Event:${{ github.event_name }}"
      
      - name: Print issue number
        if: github.event.issue.number != null
        run: echo "Issue:${{ github.event.issue.number }}"

      - name: Print comment body
        if: github.event.comment.body != null
        run: echo "Comment:${{ github.event.comment.body }}"

      - name: Auto-comment on new issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '¡Gracias por tu aporte! 🎉'
            })
              