name: 04 Events

on:
  issues: 
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Imprimir evento
        run: echo "Event:${{ github.event_name }}"
      
      - name: Print issue number
        if: github.event.issue.number != null
        run: echo "Issue:${{ github.event.issue.number }}"

      - name: Print comment body
        if: github.event.comment.body != null
        run: echo "Comment:${{ github.event.comment.body }}"

      - name: Auto-comment on new issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }} # gh se autentica con el token del runner
        run: gh issue comment ${{ github.event.issue.number }} --body '¡Gracias por tu aporte! 🎉' # no necesita checkout porque gh infiere el repo de GITHUB_REPOSITORY
              